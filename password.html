<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15392e">
  <title>Modifica password – Secret Santa 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="brand">🎄 SECRET SANTA 🎄</div>
    <p>La magia del Natale comincia qui</p>
    <span class="status">MODIFICA PASSWORD</span>
  </header>

  <main class="container">
    <section class="panel">
      <p><a href="home.html">← La mia pagina</a></p>
      <h1>Modifica password 🔑</h1>

      <form id="passwordForm">
        <label for="currentPassword">Password attuale</label>
        <input id="currentPassword" type="password" autocomplete="current-password" required>

        <label for="newPassword">Nuova password</label>
        <input id="newPassword" type="password" minlength="6" maxlength="128"
          placeholder="Almeno 6 caratteri" autocomplete="new-password" required>

        <label for="confirmPassword">Ripeti la nuova password</label>
        <input id="confirmPassword" type="password" minlength="6" maxlength="128"
          autocomplete="new-password" required>

        <button type="submit" class="primary" id="saveButton">Salva nuova password</button>
      </form>

      <p id="message" aria-live="polite"></p>
    </section>
  </main>

  <footer>✨ Un regalo, una sorpresa, un Natale speciale ✨</footer>

  <script src="common.js?v=2"></script>
  <script>
    const message = document.getElementById("message");
    const form = document.getElementById("passwordForm");

    if (!ssToken()) window.location.replace("index.html");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const current = document.getElementById("currentPassword").value;
      const next = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (next !== confirmation) {
        message.textContent = "Le due nuove password non coincidono.";
        return;
      }
      if (next === current) {
        message.textContent = "La nuova password deve essere diversa da quella attuale.";
        return;
      }

      const button = document.getElementById("saveButton");
      button.disabled = true;
      message.textContent = "Salvataggio in corso...";
      try {
        const result = await ssApi("change_my_password", {
          current_password: current,
          new_password: next
        });
        form.reset();
        message.textContent = result.message + " ✓";
      } catch (error) {
        if (error.status === 401) {
          sessionStorage.removeItem(SS_TOKEN_KEY);
          window.location.replace("index.html");
          return;
        }
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
  <script src="countdown.js?v=1" defer></script>
</body>
</html>
